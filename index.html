<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox — Yandex Mail</title>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;500;700&family=Arial:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- Yandex Mail Style Reset --- */
        * { box-sizing: border-box; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f0f0f0; color: #000; overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* --- HEADER --- */
        .header { 
            display: flex; align-items: center; padding: 0 20px; 
            background: #fff; height: 56px; border-bottom: 1px solid #e0e0e0; 
            justify-content: space-between; position: relative; z-index: 10;
        }
        
        .header-left { display: flex; align-items: center; width: 250px; }
        .hamburger { margin-right: 15px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .hamburger span { width: 18px; height: 2px; background: #000; }
        
        /* Yandex Logo Style */
        .logo { font-size: 22px; font-weight: bold; display: flex; align-items: center; letter-spacing: -0.5px; cursor: pointer; }
        .logo span:first-child { color: #fc3f1d; } /* Y - Red */
        .logo span:last-child { color: #000; } /* andex Mail */
        
        .header-middle { flex: 1; display: flex; justify-content: center; }
        .search-bar { 
            width: 100%; max-width: 600px; height: 36px; 
            background: #f5f5f5; border: 1px solid transparent; 
            border-radius: 3px; display: flex; align-items: center; padding: 0 10px;
            transition: border 0.2s, background 0.2s;
        }
        .search-bar:focus-within { background: #fff; border-color: #fc3f1d; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .search-bar input { border: none; background: transparent; flex: 1; font-size: 15px; padding-left: 10px; }
        .search-btn { color: #999; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; width: 250px; justify-content: flex-end; }
        .user-info { display: flex; align-items: center; cursor: pointer; }
        .user-name { font-weight: bold; font-size: 14px; margin-right: 10px; }
        .user-avatar { 
            width: 32px; height: 32px; border-radius: 50%; 
            background: #e0e0e0; color: #555; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 14px; border: 1px solid #ccc;
        }

        /* --- MAIN BODY --- */
        .main-body { display: flex; flex: 1; overflow: hidden; background: #fff; }
        
        /* --- SIDEBAR --- */
        .sidebar { width: 230px; background: #fff; padding: 15px 10px; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #f0f0f0; }
        
        /* The Iconic Yandex Yellow Button */
        .compose-btn { 
            background-color: #ffdb4d; color: #000; border: none; 
            height: 40px; width: 100%; border-radius: 3px; 
            font-size: 14px; font-weight: 500; cursor: pointer; 
            margin-bottom: 20px; transition: background 0.2s;
        }
        .compose-btn:hover { background-color: #fcc521; }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item { 
            display: flex; align-items: center; height: 32px; padding: 0 12px; 
            color: #333; cursor: pointer; font-size: 14px; margin-bottom: 2px; border-radius: 3px;
        }
        .nav-item:hover { background-color: #f5f5f5; }
        .nav-item.active { background-color: #f0f0f0; font-weight: bold; }
        .nav-text { flex: 1; margin-left: 10px; }
        .nav-count { color: #999; font-size: 12px; font-weight: normal; }

        /* --- CONTENT AREA --- */
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Toolbar */
        .toolbar { 
            height: 40px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; 
            padding: 0 15px; color: #777; font-size: 13px; background: #fff;
        }
        .checkbox-all { width: 16px; height: 16px; border: 1px solid #ccc; border-radius: 2px; margin-right: 15px; cursor: pointer; }
        .tool-btn { margin-right: 20px; cursor: pointer; }
        .tool-btn:hover { color: #000; }
        .view-options { margin-left: auto; cursor: pointer; }

        /* --- EMAIL LIST --- */
        .email-list-container { flex: 1; overflow-y: auto; background: #fff; }
        
        .email-row { 
            display: flex; align-items: center; height: 42px; 
            border-bottom: 1px solid #f0f0f0; padding: 0 15px; 
            cursor: pointer; font-size: 14px; position: relative;
        }
        .email-row:hover { background-color: #fff8e1; /* Yandex hover yellow tint */ }
        .email-row.active { background-color: #fff0c2; } /* Selected/Active */
        
        .row-checkbox { width: 16px; height: 16px; border: 1px solid #ccc; border-radius: 2px; margin-right: 12px; }
        .row-sender-img { 
            width: 24px; height: 24px; border-radius: 50%; margin-right: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; color: #fff; font-weight: bold; text-transform: uppercase;
        }
        
        .row-sender { width: 180px; padding-right: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000; }
        .unread .row-sender { font-weight: bold; }
        
        .row-subject-snippet { flex: 1; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .row-subject { color: #000; margin-right: 5px; }
        .unread .row-subject { font-weight: bold; }
        .row-snippet { color: #888; }
        
        .row-date { width: 80px; text-align: right; color: #888; font-size: 12px; }
        
        /* --- DETAIL VIEW (Overlay style for Yandex) --- */
        .detail-view { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background: #fff; display: none; flex-direction: column; 
            z-index: 20; padding: 0;
        }
        
        .detail-header { 
            padding: 15px 20px; border-bottom: 1px solid #e0e0e0; 
            display: flex; align-items: center; background: #fff;
        }
        .back-btn { 
            margin-right: 20px; cursor: pointer; font-size: 24px; color: #777; display: flex; align-items: center;
        }
        .back-btn:hover { color: #000; }
        
        .detail-content { padding: 20px 40px; overflow-y: auto; flex: 1; }
        .detail-subject { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #000; }
        
        .detail-meta { display: flex; align-items: center; margin-bottom: 30px; }
        .meta-avatar { 
            width: 42px; height: 42px; border-radius: 50%; 
            margin-right: 15px; display: flex; align-items: center; 
            justify-content: center; color: #fff; font-weight: bold; font-size: 18px;
        }
        .meta-text div:first-child { font-weight: bold; font-size: 14px; }
        .meta-text div:last-child { color: #888; font-size: 12px; margin-top: 2px; }
        
        .detail-body { font-size: 15px; line-height: 1.6; color: #000; white-space: pre-wrap; max-width: 800px; }
        
        .detail-actions { margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
        .quick-reply { 
            border: 1px solid #ccc; padding: 10px; border-radius: 3px; 
            color: #888; cursor: text; max-width: 600px;
        }

        /* Utility */
        .hidden { display: none !important; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    </style>
</head>

            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {

                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];

                let h = currentBaseTime.getHours();
                let m = currentBaseTime.getMinutes();
                let hhmm = `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}`;
                
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                let d = currentBaseTime.getDate();
                let mon = months[currentBaseTime.getMonth()];
                let y = currentBaseTime.getFullYear();

                if (isToday) {
                    timeStr = hhmm;
                    fullDateStr = `Today, ${hhmm}`;
                } else {
                    timeStr = `${d < 10 ? '0'+d : d} ${mon}`;
                    fullDateStr = `${d} ${mon} ${y}, ${hhmm}`;
                }

                emailDataStore.push({
                    id: i,
                    sender: senderObj.name,
                    email: `purchase@${senderObj.domain}`,
                    color: senderObj.color,
                    subject: subjectBase,
                    body: content.body,
                    time: timeStr,
                    fullDate: fullDateStr,
                    isUnread: i < 12, // First 12 are unread
                    snippet: content.snippet
                });
            }
            renderList();
        }

        function renderList() {
            const container = document.getElementById('email-list-view');
            let html = '';
            
            emailDataStore.forEach((email, index) => {
                const unreadClass = email.isUnread ? 'unread' : '';
                const senderInitial = email.sender.charAt(0).toUpperCase();

                html += `
                    <div class="email-row ${unreadClass}" onclick="openEmail(${index})">
                        <div class="row-checkbox" onclick="event.stopPropagation()"></div>
                        <div class="row-sender-img" style="background-color: ${email.color}">${senderInitial}</div>
                        <div class="row-sender">${email.sender}</div>
                        <div class="row-subject-snippet">
                            <span class="row-subject">${email.subject}</span>
                            <span class="row-snippet">- ${email.snippet}</span>
                        </div>
                        <div class="row-date">${email.time}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            
            // Random count update
            document.getElementById('inbox-count').innerText = Math.floor(Math.random() * 20) + 30;
        }

        function openEmail(index) {
            const email = emailDataStore[index];
            
            document.getElementById('detail-subject').innerText = email.subject;
            document.getElementById('detail-sender').innerText = email.sender;
            document.getElementById('detail-email').innerText = email.email;
            document.getElementById('detail-date').innerText = email.fullDate;
            document.getElementById('detail-body').innerText = email.body;
            
            const avatar = document.getElementById('detail-avatar');
            avatar.innerText = email.sender.charAt(0).toUpperCase();
            avatar.style.background = email.color;
            
            email.isUnread = false;
            // Show Detail View
            document.getElementById('email-list-view').classList.add('hidden');
            document.getElementById('email-detail-view').style.display = 'flex';
            document.getElementById('main-toolbar').classList.add('hidden');
        }

        function goBackToList() {
            document.getElementById('email-list-view').classList.remove('hidden');
            document.getElementById('email-detail-view').style.display = 'none';
            document.getElementById('main-toolbar').classList.remove('hidden');
            renderList();
        }

        function refreshAll() {
            goBackToList();
            generateData();
        }

        window.onload = generateData;

    </script>
</body>
</html>
