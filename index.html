<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox (42) - sales@chinacnu.com</title>
    <!-- 引入 Google Fonts Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* CSS Reset & Basic Style */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Roboto', sans-serif; background-color: #f6f8fc; color: #202124; overflow: hidden; }
        
        /* Layout Grid */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* --- HEADER --- */
        .header { display: flex; align-items: center; padding: 8px 16px; background: #fff; height: 64px; border-bottom: 1px solid #eaecf0; justify-content: space-between; }
        
        .header-left { display: flex; align-items: center; min-width: 230px; }
        .menu-icon { padding: 12px; margin-right: 4px; border-radius: 50%; cursor: pointer; color: #5f6368; }
        .menu-icon:hover { background-color: #f0f3f6; }
        
        .logo { display: flex; align-items: center; }
        .logo img { height: 40px; margin-right: 10px; } /* Fallback text logo below */
        .logo-text { font-size: 22px; color: #5f6368; position: relative; top: -2px; }
        .g-blue { color: #4285f4; } .g-red { color: #ea4335; } .g-yellow { color: #fbbc04; } .g-green { color: #34a853; }
        
        .header-middle { flex: 1; max-width: 720px; margin: 0 10px; }
        .search-box { background: #eaf1fb; height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 16px; transition: background 0.2s, box-shadow 0.2s; }
        .search-box:focus-within { background: #fff; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15); }
        .search-box input { border: none; background: transparent; flex: 1; margin: 0 10px; font-size: 16px; outline: none; color: #1f1f1f; }
        .search-icon { color: #444746; }
        
        .header-right { display: flex; align-items: center; padding-right: 10px; gap: 10px; }
        .icon-btn { padding: 10px; border-radius: 50%; color: #5f6368; cursor: pointer; }
        .icon-btn:hover { background-color: #f0f3f6; }
        .avatar { width: 32px; height: 32px; background-color: #0b57d0; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-left: 8px; cursor: pointer; }

        /* --- MAIN BODY --- */
        .main-body { display: flex; flex: 1; overflow: hidden; }
        
        /* --- SIDEBAR --- */
        .sidebar { width: 256px; padding-top: 8px; padding-right: 16px; display: flex; flex-direction: column; flex-shrink: 0; }
        
        .compose-btn-container { padding-left: 8px; margin-bottom: 16px; }
        .compose-btn { background-color: #c2e7ff; color: #001d35; border: none; height: 56px; min-width: 56px; padding: 0 24px 0 16px; border-radius: 16px; display: flex; align-items: center; font-weight: 500; font-size: 14px; cursor: pointer; transition: box-shadow 0.2s; font-family: 'Roboto', sans-serif; gap: 12px; }
        .compose-btn:hover { box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item { display: flex; align-items: center; height: 32px; padding: 0 12px 0 26px; border-radius: 0 16px 16px 0; color: #202124; cursor: pointer; font-size: 14px; margin-bottom: 1px; }
        .nav-item.active { background-color: #d3e3fd; font-weight: 700; color: #001d35; }
        .nav-item:hover:not(.active) { background-color: #eaecf0; }
        .nav-item .material-icons { font-size: 20px; margin-right: 18px; }
        .nav-badge { margin-left: auto; font-size: 12px; font-weight: 700; }

        /* --- EMAIL LIST --- */
        .email-view { flex: 1; background: #fff; border-radius: 16px; margin: 0 16px 16px 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.02); }
        
        .toolbar { height: 48px; border-bottom: 1px solid #eaecf0; display: flex; align-items: center; padding: 0 16px; color: #444746; }
        .checkbox { border: 2px solid #444746; border-radius: 2px; width: 15px; height: 15px; margin-right: 18px; cursor: pointer; }
        .tool-icon { margin-right: 20px; font-size: 18px; cursor: pointer; }
        
        .email-container { flex: 1; overflow-y: auto; }
        
        .email-row { display: flex; align-items: center; height: 40px; border-bottom: 1px solid #f2f2f2; padding: 0 8px 0 16px; cursor: pointer; position: relative; }
        .email-row:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); z-index: 10; background: #f2f6fc; }
        
        /* Unread State */
        .email-row.unread { background-color: #fff; font-weight: 700; color: #202124; }
        .email-row.read { background-color: #f8fafd; color: #5f6368; font-weight: 400; }
        .email-row.unread .sender, .email-row.unread .subject { font-weight: 800; }
        
        .row-icons { display: flex; align-items: center; width: 60px; flex-shrink: 0; }
        .star-icon { color: #c4c7c5; cursor: pointer; font-size: 20px; }
        .star-icon.active { color: #fbbc04; }
        
        .sender { width: 200px; padding-right: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        
        .content { flex: 1; display: flex; align-items: center; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subject { color: #1f1f1f; }
        .snippet { color: #5f6368; font-weight: 400; margin-left: 5px; }
        
        .date { width: 100px; text-align: right; font-size: 12px; font-weight: 500; color: #1f1f1f; padding-right: 10px; }
        .email-row.read .date { color: #5f6368; font-weight: 400; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dadce0; border: 4px solid transparent; background-clip: content-box; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #9aa0a6; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <span class="material-icons menu-icon">menu</span>
                <div class="logo">
                    <span class="logo-text">
                        <strong class="g-blue">G</strong><strong class="g-red">m</strong><strong class="g-yellow">a</strong><strong class="g-blue">i</strong><strong class="g-green">l</strong>
                    </span>
                </div>
            </div>
            <div class="header-middle">
                <div class="search-box">
                    <span class="material-icons search-icon">search</span>
                    <input type="text" value="to: sales@chinacnu.com" readonly>
                    <span class="material-icons search-icon" style="margin-right:10px;">tune</span>
                </div>
            </div>
            <div class="header-right">
                <span class="material-icons icon-btn">help_outline</span>
                <span class="material-icons icon-btn">settings</span>
                <span class="material-icons icon-btn">apps</span>
                <div class="avatar">C</div>
            </div>
        </header>

        <div class="main-body">
            <!-- SIDEBAR -->
            <nav class="sidebar">
                <div class="compose-btn-container">
                    <button class="compose-btn" onclick="generateEmails()">
                        <span class="material-icons">edit</span>
                        Compose
                    </button>
                </div>
                <ul class="nav-list">
                    <li class="nav-item active">
                        <span class="material-icons">inbox</span> Inbox <span class="nav-badge" id="inbox-count">42</span>
                    </li>
                    <li class="nav-item">
                        <span class="material-icons">star_border</span> Starred
                    </li>
                    <li class="nav-item">
                        <span class="material-icons">access_time</span> Snoozed
                    </li>
                    <li class="nav-item">
                        <span class="material-icons">send</span> Sent
                    </li>
                    <li class="nav-item">
                        <span class="material-icons">drafts</span> Drafts
                    </li>
                    <li class="nav-item">
                        <span class="material-icons">keyboard_arrow_down</span> More
                    </li>
                </ul>
            </nav>

            <!-- CONTENT -->
            <main class="email-view">
                <div class="toolbar">
                    <div class="checkbox"></div>
                    <span class="material-icons tool-icon" onclick="generateEmails()" title="Refresh List">refresh</span>
                    <span class="material-icons tool-icon">more_vert</span>
                    <div style="flex:1"></div>
                    <span style="font-size:12px; color:#5f6368; margin-right:15px">1-50 of 2,431</span>
                    <span class="material-icons tool-icon" style="margin:0 5px; font-size:16px">chevron_left</span>
                    <span class="material-icons tool-icon" style="margin:0; font-size:16px">chevron_right</span>
                </div>
                
                <div class="email-container" id="email-list">
                    <!-- Emails will be injected here via JS -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---

        // 1. 发件人 (混合: 欧美, 中东, 东南亚, 公司名)
        const senders = [
            "Global Steel Trading", "Ahmed Construction LLC", "PT. Indo Jaya Steel", 
            "Michael Richards", "Siam Kitchen Supplies", "Euro Metal Group", 
            "David Al-Mansour", "KBB Distributors", "Sarah Jenkins", 
            "Vietnam Steel Corp", "Hassan & Sons Trading", "Robert Mueller",
            "Golden Gate Imports", "Riyadh Hotel Projects", "John Smith",
            "Alpha Catering Equip", "Elena Volkov", "Mumbai Infrastructure",
            "West Coast Metals", "Chef's Choice Commercial"
        ];

        // 2. 钢铁外贸主题 (Steel / Metal)
        const steelSubjects = [
            "Inquiry for Galvanized Steel Coils (GI) - 200MT",
            "RFQ: SS304 Cold Rolled Sheets / 2B Finish",
            "Urgent Price Request: ASTM A36 Carbon Steel Plate",
            "Order Confirmation: Prepainted Steel Coils (PPGI)",
            "Need catalog for Corrugated Roofing Sheets",
            "FOB Price needed for Square Hollow Sections",
            "Looking for long term supplier: Stainless Steel Pipes",
            "Project Inquiry: H-Beam and I-Beam specifications",
            "Re: Quotation for CRC Coils - CIF Jebel Ali",
            "Wire Rods SAE1008 availability check"
        ];

        // 3. 商厨设备主题 (Commercial Kitchen)
        const kitchenSubjects = [
            "Quote: Commercial Stainless Steel Workbench (Custom Size)",
            "Inquiry: Heavy Duty Gas Range 6-Burner",
            "RFQ for Hotel Kitchen Project in Dubai (Full Equipment)",
            "Looking for Industrial Upright Freezer (Double Door)",
            "Price Inquiry: Commercial Dough Mixers 20L",
            "Under Counter Fridge / Saladette availability",
            "Need best price for GN Pans 1/1 containers",
            "Restaurant Project: Hood Systems and Sinks",
            "Supply of Commercial Dishwashers - Monthly Order",
            "Bakery Oven (Deck Oven) Specifications needed"
        ];

        // 4. 邮件内容片段
        const snippets = [
            "Dear Sales Team, We are working on a new government project and require...",
            "Hi, Please provide your best price for the attached list of items. We need...",
            "Hello, Can you ship to Lagos Port? What is your lead time for this quantity...",
            "We saw your profile on the web and are interested in your stainless steel range...",
            "Urgent requirement. Please confirm if you have stock for immediate shipment...",
            "Kind regards, waiting for your Proforma Invoice as discussed...",
            "We are a large distributor in Saudi Arabia looking for a new partner for...",
            "Please send technical data sheet and certificates for these items..."
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateEmails() {
            const container = document.getElementById('email-list');
            let html = '';
            
            // 生成 40 封邮件
            for (let i = 0; i < 40; i++) {
                // 逻辑: 前 12 封未读 (看起来很忙)
                const isUnread = i < 12;
                const sender = getRandom(senders);
                
                // 50% 概率是钢铁，50% 是商厨
                const isSteel = Math.random() > 0.5;
                const subjectText = isSteel ? getRandom(steelSubjects) : getRandom(kitchenSubjects);
                const snippetText = getRandom(snippets);
                
                // 生成时间
                let timeStr;
                if (i < 5) {
                    // 最近几分钟
                    timeStr = `10:${30 - i} AM`;
                } else if (i < 15) {
                    timeStr = `9:${Math.floor(Math.random()*50)+10} AM`;
                } else {
                    timeStr = "Dec 05";
                }

                // 随机星标
                const isStarred = Math.random() > 0.85 ? 'active' : '';
                const starIcon = isStarred ? 'star' : 'star_border';

                html += `
                    <div class="email-row ${isUnread ? 'unread' : 'read'}">
                        <div class="row-icons">
                            <div class="checkbox"></div>
                            <span class="material-icons star-icon ${isStarred}">${starIcon}</span>
                        </div>
                        <div class="sender">${sender}</div>
                        <div class="content">
                            <span class="subject">${subjectText}</span>
                            <span class="snippet">&nbsp;- ${snippetText}</span>
                        </div>
                        <div class="date">${timeStr}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            
            // 更新左侧未读数
            document.getElementById('inbox-count').innerText = Math.floor(Math.random() * 20) + 30; // 30-50之间
        }

        // Initialize on load
        window.onload = generateEmails;

    </script>
</body>
</html>
